apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    backup.deckhouse.io/cluster-config: "true"
    heritage: deckhouse
    module: csi-nfs
  name: nfsstorageclasses.storage.deckhouse.io
spec:
  group: storage.deckhouse.io
  names:
    categories:
    - d8-storage
    - d8-storage-classes
    kind: NFSStorageClass
    plural: nfsstorageclasses
    shortNames:
    - nsc
    singular: nfsstorageclass
  preserveUnknownFields: false
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .status.phase
      name: Phase
      priority: 1
      type: string
    - description: The age of this resource.
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Interface for managing StorageClass for the `nfs.csi.k8s.io` CSI driver.

          Manual creation of StorageClass for this driver is prohibited.
        properties:
          spec:
            description: Defines a Kubernetes StorageClass configuration.
            properties:
              chmodPermissions:
                description: chmod rights for PVs subdirectory.
                pattern: ^[0-7]{3,4}$
                type: string
              connection:
                description: NFS server connection settings.
                properties:
                  host:
                    description: NFS server host.
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: Value is immutable.
                      rule: self == oldSelf
                  mtls:
                    default: false
                    description: |-
                      > Available in SE, SE+, EE, and FE editions.

                      Whether to use mTLS — requires TLS to be enabled.
                    type: boolean
                    x-doc-d8editions:
                    - se
                    - se-plus
                    - ee
                    - fe
                    x-kubernetes-validations:
                    - message: Value is immutable.
                      rule: self == oldSelf
                  nfsVersion:
                    description: NFS version.
                    enum:
                    - "3"
                    - "4.1"
                    - "4.2"
                    type: string
                    x-kubernetes-validations:
                    - message: Value is immutable.
                      rule: self == oldSelf
                  share:
                    description: NFS server share path.
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: Value is immutable.
                      rule: self == oldSelf
                  subDir:
                    description: |-
                      Template of the directory of a PersistentVolume (PV) inside `share`. If the parameter is omitted, the directory of a PV is `<share>/<PV name>`.

                      The template may use the following placeholders, which the NFS CSI driver replaces when it creates the volume:

                      - `${pvc.metadata.namespace}` — the namespace of the PersistentVolumeClaim (PVC);
                      - `${pvc.metadata.name}` — the name of the PVC;
                      - `${pv.metadata.name}` — the name of the PV.

                      Apart from the placeholders, the template may contain Latin letters, digits, `.`, `_` and `-`, and `/` between non-empty path segments; the segments `.` and `..` are not allowed. The directory is created if it does not exist. Its path is stored in the PV when the volume is created.

                      Every PVC has to get a directory of its own: the template must contain `${pv.metadata.name}`, or both `${pvc.metadata.namespace}` and `${pvc.metadata.name}` separated by a character that cannot occur in a namespace name, for example `/` or `_`. A template without `${pv.metadata.name}` is allowed only with `reclaimPolicy: Retain`: a PVC re-created with the same name in the same namespace gets the same directory, so deleting the directory of the old volume would delete the data of the new one.

                      > **Caution.** A new volume whose directory already exists does not start empty: it gets the files left there, for example by a deleted PVC with the same name and namespace. A volume restored from a snapshot or cloned into an existing directory keeps the files that are there and does not receive the content of its source.
                    maxLength: 255
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: Value is immutable.
                      rule: self == oldSelf
                    - message: subDir may contain only Latin letters, digits, '.',
                        '_', '-', the placeholders ${pvc.metadata.namespace}, ${pvc.metadata.name}
                        and ${pv.metadata.name}, and '/' between non-empty path segments.
                      rule: self.matches('^([A-Za-z0-9._-]|[$][{](pvc[.]metadata[.]namespace|pvc[.]metadata[.]name|pv[.]metadata[.]name)[}])+(/([A-Za-z0-9._-]|[$][{](pvc[.]metadata[.]namespace|pvc[.]metadata[.]name|pv[.]metadata[.]name)[}])+)*$')
                    - message: subDir must not contain the path segments '.' and '..'.
                      rule: '!self.matches(''(^|/)[.][.]?(/|$)'')'
                    - message: 'subDir must give every PVC a directory of its own:
                        it must contain ${pv.metadata.name}, or both ${pvc.metadata.namespace}
                        and ${pvc.metadata.name} separated by a character that cannot
                        occur in a namespace name, for example ''/'' or ''_''.'
                      rule: self.contains('${pv.metadata.name}') || self.matches('[$][{]pvc[.]metadata[.]namespace[}].*[^a-z0-9-].*[$][{]pvc[.]metadata[.]name[}]')
                        || self.matches('[$][{]pvc[.]metadata[.]name[}].*[^a-z0-9-].*[$][{]pvc[.]metadata[.]namespace[}]')
                  tls:
                    default: false
                    description: |-
                      > Available in SE, SE+, EE, and FE editions.

                      Whether to use TLS for connection.
                    type: boolean
                    x-doc-d8editions:
                    - se
                    - se-plus
                    - ee
                    - fe
                    x-kubernetes-validations:
                    - message: Value is immutable.
                      rule: self == oldSelf
                required:
                - host
                - nfsVersion
                - share
                type: object
                x-kubernetes-validations:
                - message: Value is immutable.
                  rule: self == oldSelf
              mountOptions:
                description: StorageClass mount options.
                properties:
                  mountMode:
                    description: NFS share mount mode.
                    enum:
                    - hard
                    - soft
                    type: string
                  nodev:
                    description: 'Mount with `nodev` on the node: device files on
                      the share cannot be opened there. The container runtime bind-mounts
                      the volume into a container without the flag.'
                    type: boolean
                  nosuid:
                    description: 'Mount with `nosuid` on the node: the set-user-ID
                      and set-group-ID bits of the files on the share do not take
                      effect there. The container runtime bind-mounts the volume into
                      a container without the flag.'
                    type: boolean
                  readOnly:
                    description: Share read-only flag.
                    type: boolean
                  retransmissions:
                    description: The number of repeated attempts by the NFS client
                      to execute the request before it takes further steps to restore
                      the connection.
                    minimum: 1
                    type: integer
                  timeout:
                    description: |-
                      The time during which the NFS client waits for a response before repeating the NFS request, in tenths of a second.

                      For example, 600 is 60 seconds.
                    minimum: 1
                    type: integer
                type: object
              reclaimPolicy:
                description: |-
                  Defines the behavior when a PersistentVolumeClaim (PVC) is deleted.

                  Allowed values:

                  - `Delete` — when the PVC is deleted, the associated PersistentVolume (PV) and corresponding data on the NFS server are also deleted;
                  - `Retain` — when the PVC is deleted, the associated PersistentVolume and data on the NFS server are not deleted and require manual removal by the user. See more in [the Kubernetes documentation](https://kubernetes.io/docs/concepts/storage/persistent-volumes/#reclaiming).
                enum:
                - Delete
                - Retain
                type: string
                x-kubernetes-validations:
                - message: Value is immutable.
                  rule: self == oldSelf
              tlsParameters:
                description: |-
                  > Available in SE, SE+, EE, and FE editions.

                  RPC-with-TLS parameters of the class, for `connection.tls: true`. With them a class with TLS does not need `tlsParameters.ca` of the module.
                properties:
                  ca:
                    description: 'Root certificate in PEM format, encoded in Base64,
                      that verifies the certificate of the NFS server of this class.
                      The nodes trust it together with the CAs of the other classes
                      and `tlsParameters.ca` of the module: the truststore of a node
                      is one for all its mounts, so a class adds a CA rather than
                      limiting which servers its volumes trust.'
                    minLength: 1
                    pattern: ^[A-Za-z0-9+/]*={0,2}$
                    type: string
                required:
                - ca
                type: object
                x-doc-d8editions:
                - se
                - se-plus
                - ee
                - fe
              volumeBindingMode:
                description: |-
                  Defines the volume binding mode.

                  Allowed values:

                  - `Immediate` — the volume is provisioned immediately after the PersistentVolumeClaim (PVC) is created;
                  - `WaitForFirstConsumer` — the volume is provisioned only when the PVC is first used by a pod. See more in [the Kubernetes documentation](https://kubernetes.io/docs/concepts/storage/storage-classes/#volume-binding-mode).
                enum:
                - Immediate
                - WaitForFirstConsumer
                type: string
                x-kubernetes-validations:
                - message: Value is immutable.
                  rule: self == oldSelf
              volumeCleanup:
                description: |-
                  > This feature is available in Enterprise Edition.

                  Specifies the cleanup method to be applied to the PV's subdirectory content before deletion.

                  If the parameter is omitted, the NFS CSI driver deletes the directory created for the Persistent Volume (PV) on the NFS server without performing any data cleanup.
                  If the parameter is set, the driver erases each file in the PV directory.

                  Allowed values:

                  - `Discard` — uses the filesystem's discard (trim) functionality to free data blocks (this option is available only when supported, for example with NFSv4.2);
                  - `RandomFillSinglePass` — overwrites the content of each file once with random data before deletion. This is implemented by invoking the utility `shred`;
                  - `RandomFillThreePass` — overwrites the content of each file three times with random data before deletion. This is implemented by invoking the utility `shred`.
                enum:
                - Discard
                - RandomFillSinglePass
                - RandomFillThreePass
                type: string
                x-doc-d8editions:
                - ee
                - fe
              workloadNodes:
                minProperties: 1
                properties:
                  nodeSelector:
                    description: |-
                      Node selector to specify rules for selecting nodes where Persistent Volumes (PVs) created by this StorageClass are allowed to connect.

                      Combines simple label matches and advanced matching expressions.

                      If this parameter is omitted, NFS shares can be mounted on any node in the cluster running the Linux OS.
                    minProperties: 1
                    properties:
                      matchExpressions:
                        description: |-
                          A list of advanced node selector requirements.

                          Each requirement specifies a key, an operator, and optional values for filtering nodes based on their labels or other fields.
                        items:
                          description: A label selector requirement -- a key, an operator
                            and, for some operators, a list of values.
                          properties:
                            key:
                              description: The label key that the requirement applies
                                to.
                              type: string
                            operator:
                              description: The operator to apply for the key.
                              enum:
                              - In
                              - NotIn
                              - Exists
                              - DoesNotExist
                              type: string
                            values:
                              description: A list of string values. Required for operators
                                such as `In` or `NotIn`, and ignored for `Exists`
                                or `DoesNotExist`.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          A map of labels that must match exactly with the labels of a node.

                          Nodes that do not match any of the specified labels will be excluded.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                type: object
            required:
            - connection
            - reclaimPolicy
            - volumeBindingMode
            type: object
            x-kubernetes-validations:
            - message: If mtls is true, tls must also be true.
              rule: '!(self.connection.mtls == true) || (self.connection.tls == true)'
            - message: tlsParameters require connection.tls to be true.
              rule: '!has(self.tlsParameters) || self.connection.tls == true'
            - message: If reclaimPolicy is 'Retain', volumeCleanup must be omitted.
              rule: self.reclaimPolicy != 'Retain' || !has(self.volumeCleanup)
            - message: Discard mode is only available when connection.nfsVersion is
                '4.2'.
              rule: self.connection.nfsVersion == '4.2' || !has(self.volumeCleanup)||
                self.volumeCleanup != 'Discard'
            - message: If connection.subDir does not contain ${pv.metadata.name},
                reclaimPolicy must be 'Retain'.
              rule: '!has(self.connection.subDir) || self.connection.subDir.contains(''${pv.metadata.name}'')
                || self.reclaimPolicy == ''Retain'''
          status:
            description: Displays current information about the StorageClass.
            properties:
              clientCA:
                description: |-
                  > Available in SE, SE+, EE, and FE editions.

                  The CA of the client certificate the nodes present when they mount the volumes of a class with `spec.connection.mtls`, in PEM format, encoded in Base64. The NFS server of the class has to trust it. Empty when the class does not use mTLS, or when `tlsParameters.mtls` of the module sets a client certificate without `clientCA`.
                type: string
                x-doc-d8editions:
                - se
                - se-plus
                - ee
                - fe
              conditions:
                description: 'The latest observations of the resource state. Condition
                  types: `Ready`, `RootSquash`.'
                items:
                  properties:
                    lastTransitionTime:
                      description: |-
                        Timestamp of the last status transition for this condition. It is not bumped
                        when only the reason or the message changes.
                      format: date-time
                      type: string
                    message:
                      description: Human-readable explanation of the current status.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: The value of `metadata.generation` this condition
                        was set against.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        Machine-readable reason for the current status, suitable for log filtering
                        and alerting.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: Current status of the condition.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: |-
                        Condition type.

                        `Ready` is `True` once the StorageClass, the mount-options secret and the VolumeSnapshotClass are in place, `False` when a reconcile pass failed, and `Unknown` before the controller has observed the resource.

                        `RootSquash` is `True` when the NFS server maps root to another user on the export (`root_squash` or `all_squash`), `False` when root keeps its identity, and `Unknown` when the check could not reach a verdict: the export could not be mounted (reason `MountFailed`), it is read-only (`ExportReadOnly`), or the check failed otherwise (`ProbeFailed`). The CSI controller checks the export when the NFSStorageClass is created and every 10 minutes after that. The condition only warns and does not affect `Ready`.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  The value of `metadata.generation` the controller has last acted on. When it trails
                  `metadata.generation`, the controller has not yet processed the latest spec, and the
                  conditions below still describe the previous one.
                format: int64
                type: integer
              phase:
                description: Deprecated. Derived from the `Ready` condition. `Created`
                  while `Ready` is `True`, `Failed` while it is `False`, absent while
                  it is `Unknown`. Read `status.conditions` instead.
                enum:
                - Failed
                - Created
                type: string
              reason:
                description: Deprecated. Repeats the message of the `Ready` condition.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
