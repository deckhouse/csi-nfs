apiVersion: rbac.deckhouse.io/v1alpha1
resources:
  - group: storage.deckhouse.io
    resource: nfsstorageclasses
    system:
      manager:
        - create
        - delete
        - deletecollection
        - patch
        - update
      viewer:
        - get
        - list
        - watch
    legacy:
      ClusterEditor:
        - create
        - delete
        - deletecollection
        - patch
        - update
      User:
        - get
        - list
        - watch
prometheusAccess:
  - path: controller
    name: prometheus-metrics
    deployments:
      - controller
    when: (.Values.global.enabledModules | has "prometheus")
    labels:
      app: controller
access:
  - name: admin-kubeconfig
    subjects:
      - kind: Group
        name: kubeadm:cluster-admins
    clusterRules:
      - apiGroups:
          - storage.deckhouse.io
        resources:
          - nfsstorageclasses
        verbs:
          - get
          - list
          - watch
          - create
          - delete
          - deletecollection
          - patch
          - update
