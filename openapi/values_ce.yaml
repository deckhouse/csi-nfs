x-extend:
  schema: config-values.yaml
type: object
properties:
  internal:
    type: object
    default: {}
    properties:
      featureTLSEnabled:
        type: boolean
        default: false
      pythonVersions:
        type: array
        default: []
        items:
          type: string
      tlsCABundle:
        type: string
        default: ""
        description: |
          The CAs that verify the NFS servers, PEM encoded in Base64: tlsParameters.ca of the module and spec.tlsParameters.ca of every NFSStorageClass, gathered by a hook. Empty when no CA is configured, and then tlshd does not run.
      customWebhookCert:
        type: object
        default: {}
        x-required-for-helm:
          - crt
          - key
          - ca
        properties:
          crt:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          key:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          ca:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
      clientTLS:
        type: object
        default: {}
        description: |
          The client identity of the nodes for mounts with xprtsec=mtls, issued by a hook: tlshd presents one client certificate for every such mount of a node. tlsParameters.mtls of the module replaces it when set.
        properties:
          crt:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          key:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          ca:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          caKey:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
      customSchedulerExtenderCert:
        type: object
        default: {}
        x-required-for-helm:
          - crt
          - key
          - ca
        properties:
          crt:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          key:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          ca:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
      controllerMetricsProxyPort:
        type: integer
        default: 8080
        description: |
          The port the module controller serves its metrics on, over HTTPS. What is
          on it is the validity of the RPC-with-TLS certificates: one series per
          certificate, populated only where that feature is on, next to the
          manager's own metrics, which are there in every case. Reaching it
          requires "get" on deployments/prometheus-metrics for the controller,
          which the controller checks on every scrape.
      schedulerExtenderMetricsPort:
        type: integer
        default: 8080
        description: |
          Not used: the scheduler extender serves its metrics on
          schedulerExtenderMetricsProxyPort.
      schedulerExtenderMetricsProxyPort:
        type: integer
        default: 8080
        description: |
          The port the scheduler extender serves its metrics on, over HTTPS. Reaching
          it requires "get" on deployments/prometheus-metrics for
          csi-nfs-scheduler-extender, which the extender checks on every scrape.
      controllerMetricsPort:
        type: integer
        description: |
          Not used: the module controller serves its metrics on
          controllerMetricsProxyPort.
        default: 4223
      shedulerExtenderEnabled:
        type: boolean
        default: false
      storageClassLabelIgnoredPrefixesSystem:
        type: array
        description: |
          System list of label-key prefixes that MUST NOT be propagated from
          an NFSStorageClass to the managed Kubernetes StorageClass.
          This list is hardcoded and cannot be changed by users.
        default:
          - app.kubernetes.io/managed-by
          - app.kubernetes.io/instance
          - kubernetes.io/
          - k8s.io/
          - storage.deckhouse.io/managed-by
        items:
          type: string
  registry:
    type: object
    description: "System field, overwritten by Deckhouse. Don't use"
