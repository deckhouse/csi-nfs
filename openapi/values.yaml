x-extend:
  schema: config-values.yaml
type: object
properties:
  internal:
    type: object
    default: {}
    properties:
      featureTLSEnabled:
        type: boolean
        default: true
      pythonVersions:
        type: array
        default: []
        items:
          type: string
      tlsCABundle:
        type: string
        default: ""
        description: |
          The CAs that verify the NFS servers, PEM encoded in Base64: tlsParameters.ca of the module and spec.tlsParameters.ca of every NFSStorageClass, gathered by a hook. Empty when no CA is configured, and then tlshd does not run.
      customWebhookCert:
        type: object
        default: {}
        x-required-for-helm:
          - crt
          - key
          - ca
        properties:
          crt:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          key:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          ca:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
      customSchedulerExtenderCert:
        type: object
        default: {}
        x-required-for-helm:
          - crt
          - key
          - ca
        properties:
          crt:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          key:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          ca:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
      controllerMetricsProxyPort:
        type: integer
        default: 8080
        description: |
          The port the kube-rbac-proxy publishes the controller metrics on. Reaching
          it requires "get" on deployments/prometheus-metrics for the controller; the
          controller itself keeps its metrics on 127.0.0.1.
      schedulerExtenderMetricsPort:
        type: integer
        default: 8080
        description: |
          The port the scheduler extender serves its metrics on, bound on 127.0.0.1:
          the only thing that reaches it is the kube-rbac-proxy of the same pod.
      schedulerExtenderMetricsProxyPort:
        type: integer
        default: 8080
        description: |
          The port the kube-rbac-proxy publishes the extender metrics on. The proxy
          listens on the pod IP and the extender on 127.0.0.1, so the two can hold the
          same port number: they are different sockets.
      controllerMetricsPort:
        type: integer
        description: |
          The port the module controller serves its metrics on. What is on it is
          the validity of the RPC-with-TLS certificates: one series per
          certificate, populated only where that feature is on, next to the
          manager's own metrics, which are there in every case.
        default: 4223
      shedulerExtenderEnabled:
        type: boolean
        default: false
      storageClassLabelIgnoredPrefixesSystem:
        type: array
        description: |
          System list of label-key prefixes that MUST NOT be propagated from
          an NFSStorageClass to the managed Kubernetes StorageClass.
          This list is hardcoded and cannot be changed by users.
        default:
          - app.kubernetes.io/managed-by
          - app.kubernetes.io/instance
          - kubernetes.io/
          - k8s.io/
          - storage.deckhouse.io/managed-by
        items:
          type: string
  registry:
    type: object
    description: "System field, overwritten by Deckhouse. Don't use"
