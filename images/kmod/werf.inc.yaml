---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}-runtime-artifact
from: {{ index $.Images "builder/distroless" }}
final: false
shell:
  setup:
    - pm install --rootDir /relocate kmod
    - mkdir -p /relocate/etc
    - if [ -x /relocate/sbin/ldconfig ]; then chroot /relocate /sbin/ldconfig; fi

---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}
from: {{ index $.Images "base/distroless" }}
import:
  - image: {{ .ModuleNamePrefix }}{{ .ImageName }}-runtime-artifact
    add: /relocate
    to: /
    before: setup
git:
{{- include "image mount points" . }}
