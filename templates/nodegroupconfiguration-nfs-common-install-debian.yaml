{{- if .Values.csiNfs.v3support }}
---
apiVersion: deckhouse.io/v1alpha1
kind: NodeGroupConfiguration
metadata:
  name: nfs-common-install-debian.sh
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
spec:
  weight: 98
  nodeGroups: [ "*" ]
  bundles: [ "ubuntu-lts", "debian", "astra" ]
  content: |
    # Copyright 2024 Flant JSC
    #
    # Licensed under the Apache License, Version 2.0 (the "License");
    # you may not use this file except in compliance with the License.
    # You may obtain a copy of the License at
    #
    #     http://www.apache.org/licenses/LICENSE-2.0
    #
    # Unless required by applicable law or agreed to in writing, software
    # distributed under the License is distributed on an "AS IS" BASIS,
    # WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
    # See the License for the specific language governing permissions and
    # limitations under the License.

    MODULE_REPOSITORY="{{ .Values.csiNfs.registry.base }}"
    kubeconfig="/etc/kubernetes/kubelet.conf"
    is_csi_nfs_node=$(bb-kubectl --kubeconfig $kubeconfig  get node "$(hostname)" -o json | jq -c '.metadata.labels | contains({"storage.deckhouse.io/csi-nfs-node":""})')
    bb-log-info "is_csi_nfs_node: "$is_csi_nfs_node

    if [ "$is_csi_nfs_node" == "false" ]; then
      bb-log-info "This node is not a CSI NFS node. Skipping installation rpcbind and nfs-utils."
      exit 0
    fi

    # The distribution's own locations only; the package's copies live under
    # /var/lib/deckhouse/sds/csi-nfs.
    host_has() {
      local candidate
      for candidate in "/usr/sbin/$1" "/sbin/$1" "/usr/bin/$1" "/bin/$1"; do
        [[ -x "${candidate}" ]] && return 0
      done
      return 1
    }

    # rpp-get runs a package's /install only for a digest it has not installed
    # yet, so what the package took over on this node is decided once per module
    # version. A node whose own tools changed since — one removed, or the
    # distribution's package installed next to ours — would keep that decision:
    # a tool nobody provides, or two daemons side by side. Forgetting the
    # installed digest makes /install decide again.
    reinstall_if_stale() {
      local package=$1 prefix=$2 tool host ours
      shift 2
      for tool in "$@"; do
        host=false
        ours=false
        host_has "${tool}" && host=true
        [[ -x "${prefix}/bin/${tool}" ]] && ours=true
        if [[ "${host}" == "${ours}" ]]; then
          bb-log-info "${tool} on this node no longer matches the installed ${package} package; installing it again."
          rm -f "/var/cache/registrypackages/${package}/digest"
          return 0
        fi
      done
    }

    # rpcbind and rpc.statd come from the module's own package image and never
    # from the node's repositories: a node that cannot reach them used to spend
    # every bashible run waiting out the package manager before it got to the
    # image. The package's /install keeps each daemon the host already has and
    # brings the missing ones up under units of its own.
    reinstall_if_stale nfsTools /var/lib/deckhouse/sds/csi-nfs rpcbind rpc.statd
    bb-package-module-install "nfsTools:{{ include "helm_lib_module_image_digest" (list . "nfsTools" "csiNfs") }}" "$MODULE_REPOSITORY" "csi-nfs"

    # What follows drives the distribution's units, so it is done only for the
    # daemons the host has of its own; the package started units for the rest.
    # This is dirty hack for statd, because it can't be enabled via systemd in newer distributive (Bashible performs a full cycle at every node reboot, so statd will be started)
    if host_has rpc.statd; then
      systemctl start rpc-statd.service
    fi
{{- end }}
