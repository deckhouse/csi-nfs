{{- /* Webhook TLS Certs Secret */ -}}
{{- $secretConfig := dict
  "valuesKey" "csiNfs"
  "webhookCertPath" "internal.customWebhookCert"
}}
{{ include "helm_lib_module_webhook_certs_secret" (list . $secretConfig) }}

{{- $systemIgnoredPrefixes := default (list) .Values.csiNfs.internal.storageClassLabelIgnoredPrefixesSystem }}
{{- $userIgnoredPrefixes := default (list) .Values.csiNfs.storageClassLabelIgnoredPrefixes }}
{{- $ignoredPrefixes := concat $systemIgnoredPrefixes $userIgnoredPrefixes | uniq }}

{{- /* Controller Deployment */ -}}
{{- $config := dict
  "valuesKey" "csiNfs"
  "webhookEnabled" true
  "webhookCertPath" "internal.customWebhookCert"
  "onMasterNode" true
  "podSecurityContext" "deckhouse"
  "controllerMetricsPort" (int .Values.csiNfs.internal.controllerMetricsPort)
  "controllerMetricsProxyPort" (int .Values.csiNfs.internal.controllerMetricsProxyPort)
  "additionalControllerEnvs" (list
    (dict "name" "STORAGE_CLASS_LABEL_IGNORED_PREFIXES" "value" (join "," $ignoredPrefixes)))
}}
{{ include "helm_lib_module_controller_manifests" (list . $config) }}

{{- /* Webhook Service, with the metrics port next to it.

What is on that port is the validity of the RPC-with-TLS certificates - one series per
certificate, with its subject, its serial and the two ends of its validity period. It
lives on the controller and not on the node driver although every node pod mounts the
same certificates: the ConfigMap is one object for the whole cluster, so reading it once
per node would publish the same numbers as many times as there are nodes.

The port is exposed whatever the edition and whatever the configuration. The gauges are
only populated where RPC-with-TLS is on, and the endpoint carries the manager's own
metrics - reconcile counts, queue depth, Go runtime - in every case. */ -}}
{{ include "helm_lib_module_webhook_service" (list . (dict
  "additionalPorts" (list (dict
    "name" "https-metrics"
    "port" (int .Values.csiNfs.internal.controllerMetricsProxyPort)
    "targetPort" "https-metrics")))) }}

{{- /* ValidatingWebhookConfiguration for StorageClasses */ -}}
{{- $scWebhookConfig := dict
  "name" "sc-validation"
  "webhookName" "sc-validation"
  "valuesKey" "csiNfs"
  "path" "/sc-validate"
  "rules" (list (dict "apiGroups" (list "storage.k8s.io") "apiVersions" (list "v1") "operations" (list "*") "resources" (list "storageclasses") "scope" "Cluster"))
  "matchConditions" (list (dict "name" "nfs-provisioner" "expression" "(object != null && object.provisioner == \"nfs.csi.k8s.io\") || (oldObject != null && oldObject.provisioner == \"nfs.csi.k8s.io\")"))
}}
{{ include "helm_lib_module_validating_webhook_configuration" (list . $scWebhookConfig) }}

{{- /* ValidatingWebhookConfiguration for NFSStorageClasses */ -}}
{{- $nscWebhookConfig := dict
  "name" "nsc-validation"
  "webhookName" "nsc-validation"
  "valuesKey" "csiNfs"
  "path" "/nsc-validate"
  "rules" (list (dict "apiGroups" (list "storage.deckhouse.io") "apiVersions" (list "v1alpha1") "operations" (list "CREATE" "UPDATE" "DELETE") "resources" (list "nfsstorageclasses") "scope" "Cluster"))
}}
{{ include "helm_lib_module_validating_webhook_configuration" (list . $nscWebhookConfig) }}

{{- /* ValidatingWebhookConfiguration for ModuleConfigs */ -}}
{{- $mcWebhookConfig := dict
  "name" "mc-validation"
  "webhookName" "mc-validation"
  "valuesKey" "csiNfs"
  "path" "/mc-validate"
  "rules" (list (dict "apiGroups" (list "deckhouse.io") "apiVersions" (list "v1alpha1") "operations" (list "CREATE" "UPDATE") "resources" (list "moduleconfigs") "scope" "Cluster"))
  "matchConditions" (list (dict "name" (printf "match-%s" .Chart.Name) "expression" (printf "request.name == \"%s\"" .Chart.Name)))
}}
{{ include "helm_lib_module_validating_webhook_configuration" (list . $mcWebhookConfig) }}
