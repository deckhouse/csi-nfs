{{- /* RBAC

The configmaps rule in roleRules is the tlshd ConfigMap, which tls_metrics.go reads to
publish when the RPC-with-TLS certificates stop being valid. `get` on that one name and
nothing else: the pass re-reads it uncached every ten minutes, so it needs neither `list`
nor `watch` - and those two cannot be restricted to a single object by RBAC, so asking for
them would hand this ServiceAccount every ConfigMap in the namespace instead of the one it
actually reads.

(The note lives up here rather than beside the rule because a template comment inside the
argument list of a dict call is a parse error - "unexpected { in operand" - and the whole
release then fails to render.) */ -}}
{{- /*
  controllerMetricsProxyPort is not used as a port here. It makes
  helm_lib_module_controller_rbac bind the controller to d8:rbac-proxy, which lets
  the controller create the TokenReview and SubjectAccessReview every scrape is
  authorised with. Without it every scrape fails and the only symptom is up == 0
  and a permanent TargetDown.
*/ -}}
{{- $rbacConfig := dict
  "controllerMetricsProxyPort" (int .Values.csiNfs.internal.controllerMetricsProxyPort)
  "roleRules" (list
    (dict "apiGroups" (list "") "resources" (list "secrets") "verbs" (list "get" "list" "watch" "create" "update" "delete"))
    (dict "apiGroups" (list "") "resources" (list "pods") "verbs" (list "get" "list" "watch" "update" "delete"))
    (dict "apiGroups" (list "") "resources" (list "events") "verbs" (list "create" "patch"))
    (dict "apiGroups" (list "events.k8s.io") "resources" (list "events") "verbs" (list "create" "patch"))
    (dict "apiGroups" (list "coordination.k8s.io") "resources" (list "leases") "verbs" (list "get" "watch" "list" "delete" "update" "create"))
    (dict "apiGroups" (list "") "resources" (list "configmaps") "resourceNames" (list "tlshd-conf") "verbs" (list "get"))
  )
  "clusterRoleRules" (list
    (dict "apiGroups" (list "storage.deckhouse.io") "resources" (list "nfsstorageclasses" "nfsstorageclasses/status") "verbs" (list "get" "list" "create" "watch" "update"))
    (dict "apiGroups" (list "storage.k8s.io") "resources" (list "storageclasses") "verbs" (list "create" "delete" "list" "get" "watch" "update"))
    (dict "apiGroups" (list "deckhouse.io") "resources" (list "moduleconfigs") "verbs" (list "get" "watch" "list"))
    (dict "apiGroups" (list "snapshot.storage.k8s.io") "resources" (list "volumesnapshots") "verbs" (list "get" "list" "watch"))
    (dict "apiGroups" (list "snapshot.storage.k8s.io") "resources" (list "volumesnapshotclasses") "verbs" (list "create" "delete" "list" "get" "watch" "update"))
    (dict "apiGroups" (list "") "resources" (list "persistentvolumeclaims" "pods" "namespaces") "verbs" (list "get" "list" "watch"))
    (dict "apiGroups" (list "") "resources" (list "nodes") "verbs" (list "get" "list" "watch" "update"))
  )
}}
{{ include "helm_lib_module_controller_rbac" (list . $rbacConfig) }}
{{- /*
  The controller records Events on NFSStorageClass through events.k8s.io/v1.
  NFSStorageClass is cluster-scoped, and the Event of a cluster-scoped object is
  created in the default namespace: client-go creates it there and patches it on
  a repeat. The "events" rules above cover only the module namespace, where
  leader election records.
*/}}
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: d8:{{ .Chart.Name }}:controller:events
  namespace: default
  {{- include "helm_lib_module_labels" (list . (dict "app" "controller")) | nindent 2 }}
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: d8:{{ .Chart.Name }}:controller:events
  namespace: default
  {{- include "helm_lib_module_labels" (list . (dict "app" "controller")) | nindent 2 }}
subjects:
  - kind: ServiceAccount
    name: controller
    namespace: d8-{{ .Chart.Name }}
roleRef:
  kind: Role
  name: d8:{{ .Chart.Name }}:controller:events
  apiGroup: rbac.authorization.k8s.io
