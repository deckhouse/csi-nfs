{{- /* The scrape of the controller metrics.

Gated on the presence of the kind itself, the way every other monitor of the fleet is:
applying a ServiceMonitor to a cluster that has no such kind fails the whole release, and
this module is expected to install on clusters with monitoring turned off. The helper
answers from global.discovery.apiVersions as well as from helm's capabilities, so it also
covers the converge in which the Prometheus operator CRDs have only just been applied.

What is on that port is the validity of the RPC-with-TLS certificates - the one part of
this module nothing rotates - and the manager's own metrics. The alerts built on it live in
monitoring/prometheus-rules/tls.yaml.

The controller serves that port over HTTPS and authorizes every scrape itself. That makes
both of the fields below load-bearing rather than decorative - without bearerTokenSecret
the controller answers 401, and without tlsConfig Prometheus rejects the controller's
self-signed certificate. A scrape that fails for either reason is indistinguishable from "the feature
is off": the rules in monitoring/prometheus-rules/tls.yaml carry no absent() arm, by
design, so nothing would fire to say the certificates stopped being watched. */ -}}
{{- if (include "helm_lib_api_version_exists" (list . "monitoring.coreos.com/v1/ServiceMonitor")) }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: csi-nfs-controller
  namespace: d8-monitoring
  {{- include "helm_lib_module_labels" (list . (dict "prometheus" "main")) | nindent 2 }}
spec:
  endpoints:
    - port: https-metrics
      scheme: https
      path: /metrics
      bearerTokenSecret:
        name: "prometheus-token"
        key: "token"
      tlsConfig:
        insecureSkipVerify: true
      {{- /* Dropping pod is what makes these series about the module rather than about
      one of its replicas. The certificate gauges are published by the leader only, so
      keeping the pod label would make every leader change look like one certificate
      disappearing and another appearing - and an alert firing on it would resolve and
      re-fire with a different label set for a certificate that never changed. */}}
      relabelings:
        - regex: endpoint|namespace|pod|container
          action: labeldrop
        - targetLabel: job
          replacement: csi-nfs-controller
        - targetLabel: tier
          replacement: cluster
        - sourceLabels: [__meta_kubernetes_endpointslice_endpoint_conditions_ready]
          regex: "true"
          action: keep
  selector:
    matchLabels:
      app: controller
  namespaceSelector:
    matchNames:
      - d8-{{ .Chart.Name }}
{{- end }}
