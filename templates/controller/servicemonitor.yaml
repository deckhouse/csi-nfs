{{- /* The scrape of the controller metrics.

Gated on the Prometheus operator CRDs the same way the alerting rules are: applying a
ServiceMonitor to a cluster that has no such kind fails the whole release, and this module
is expected to install on clusters with monitoring turned off.

What is on that port is the validity of the RPC-with-TLS certificates - the one part of
this module nothing rotates - and the manager's own metrics. The alerts built on it live in
monitoring/prometheus-rules/tls.yaml.

No bearerTokenSecret, no tlsConfig and no kube-rbac-proxy, deliberately. The endpoint asks
for nothing, so a token buys no access - and with scheme: http Prometheus would still put
`Authorization: Bearer <token>` on the wire in the clear on every scrape. That token
belongs to Prometheus's own service account and can read a great deal; handing copies of it
to anything that can see pod traffic, in exchange for nothing, is a worse trade than the
consistency with the sibling modules is worth. tlsConfig is not applied at all under
scheme: http, so carrying one would only mislead the reader into thinking the hop is
protected.

What the endpoint publishes about the certificates is their subject, their serial and their
validity dates - metadata that every server presented with those certificates already
receives, and no key material. It is a ClusterIP reachable only from inside the cluster,
and any pod that reads it learns nothing it could act on. */ -}}
{{- if (.Values.global.enabledModules | has "operator-prometheus-crd") }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: csi-nfs-controller
  namespace: d8-monitoring
  {{- include "helm_lib_module_labels" (list . (dict "prometheus" "main")) | nindent 2 }}
spec:
  endpoints:
    - port: metrics
      scheme: http
      path: /metrics
      {{- /* Dropping pod is what makes these series about the module rather than about
      one of its replicas. The certificate gauges are published by the leader only, so
      keeping the pod label would make every leader change look like one certificate
      disappearing and another appearing - and an alert firing on it would resolve and
      re-fire with a different label set for a certificate that never changed. */}}
      relabelings:
        - regex: endpoint|namespace|pod|container
          action: labeldrop
        - targetLabel: job
          replacement: csi-nfs-controller
        - targetLabel: tier
          replacement: cluster
        - sourceLabels: [__meta_kubernetes_endpointslice_endpoint_conditions_ready]
          regex: "true"
          action: keep
  selector:
    matchLabels:
      app: controller
  namespaceSelector:
    matchNames:
      - d8-{{ .Chart.Name }}
{{- end }}
