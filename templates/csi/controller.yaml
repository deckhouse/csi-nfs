###
### common
###

{{- $csiControllerImage := include "helm_lib_module_image" (list . "csiNfs") }}


{{- define "csi_init_containers" }}
{{- if .Values.csiNfs.v3support }}
- name: wait-rpcbind
  image: {{ include "helm_lib_module_image" (list . "waitRpcbind") }}
  command: ["/wait-rpcbind"]
  imagePullPolicy: IfNotPresent
  volumeMounts:
    - name: host-run
      mountPath: /run
  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
{{- end }}

{{- if .Values.csiNfs.internal.featureTLSEnabled }}
{{- if .Values.csiNfs.internal.tlsCABundle }}
- name: ktls-enabler
  image: {{ include "helm_lib_module_image" (list . "kmod") }}
  command: ["/bin/modprobe", "tls"]
  imagePullPolicy: IfNotPresent
  securityContext:
    privileged: true
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  volumeMounts:
    - name: host-sys
      mountPath: /sys
    - name: host-sys-fs-cgroup
      mountPath: /sys/fs/cgroup
    - name: host-lib-modules
      mountPath: /lib/modules
- name: net-handshake-checker
  image: {{ include "helm_lib_module_image" (list . "tlshd") }}
  args: ["--mode=init-containers"]
  imagePullPolicy: IfNotPresent
  env:
    - name: LOG_LEVEL
      value: {{ include "helm_lib_module_controller_log_level" (list . "csiNfs") | quote }}
  securityContext:
    privileged: true
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
{{- end }}
{{- end }}
{{- end }}

{{- define "csi_init_containers_volume" }}
{{- if .Values.csiNfs.v3support }}
- name: host-run
  hostPath:
    path: /run
    type: Directory
{{- end }}

{{- if .Values.csiNfs.internal.featureTLSEnabled }}
{{- if .Values.csiNfs.internal.tlsCABundle }}
- name: host-sys
  hostPath:
    path: /sys
    type: Directory
- name: host-sys-fs-cgroup
  hostPath:
    path: /sys/fs/cgroup
    type: Directory
- name: host-lib-modules
  hostPath:
    path: /lib/modules
    type: Directory
{{- end }}
{{- end }}
{{- end }}


{{- define "csi_tlshd_container" }}
{{- if .Values.csiNfs.internal.featureTLSEnabled }}
{{- if .Values.csiNfs.internal.tlsCABundle }}
- name: tlshd
  image: {{ include "helm_lib_module_image" (list . "tlshd") }}
  args: ["--mode=containers"]
  imagePullPolicy: IfNotPresent
  env:
    - name: LOG_LEVEL
      value: {{ include "helm_lib_module_controller_log_level" (list . "csiNfs") | quote }}
  securityContext:
    privileged: true
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    requests:
      {{- include "helm_lib_module_ephemeral_storage_only_logs" . | nindent 6 }}    
  volumeMounts:
    - name: cm-tlshd-conf
      mountPath: /etc/tlshd.conf
      subPath: tlshd.conf
      readOnly: true
    - name: cm-tlshd-ca
      mountPath: /etc/tlshd-ca
      readOnly: true

    {{- if include "csi_nfs_client_key" . }}
    - name: tlshd-client
      mountPath: /etc/tlshd-client
      readOnly: true
    {{- end }}

{{- end }}
{{- end }}
{{- end }}

{{- define "csi_tlshd_container_volume" }}
{{- if .Values.csiNfs.internal.featureTLSEnabled }}
{{- if .Values.csiNfs.internal.tlsCABundle }}
- name: cm-tlshd-conf
  configMap:
    name: tlshd-conf
    defaultMode: 384
- name: cm-tlshd-ca
  configMap:
    name: tlshd-conf
    defaultMode: 384
    items:
      - key: ca.crt
        path: ca.crt
{{- if include "csi_nfs_client_key" . }}
{{- /* A directory rather than subPath files: kubelet refreshes it, so a renewed identity reaches tlshd, which reads the files on every handshake. Modes are the ones tlshd expects. */}}
- name: tlshd-client
  projected:
    sources:
      - configMap:
          name: tlshd-conf
          items:
            - key: client.crt
              path: client.crt
              mode: 420
      - secret:
          name: tlshd-client-key
          items:
            - key: client.key
              path: client.key
              mode: 384
{{- end }}
{{- end }}
{{- end }}
{{- end }}


{{- define "nfsv3_container_volume_mounts" }}
{{- if .Values.csiNfs.v3support }}
- name: host-run
  mountPath: /run
{{- end }}
{{- end }}

{{- define "csi_custom_node_selector" }}
storage.deckhouse.io/csi-nfs-node: ""
{{- end }}


###
### controller
###


{{- define "csi_controller_args" }}
- "--v={{ include "module_klog_verbosity" . }}"
- "--nodeid=$(NODE_ID)"
- "--endpoint=$(CSI_ENDPOINT)"
- "--drivername=nfs.csi.k8s.io"
- "--mount-permissions=0"
- "--working-mount-dir=/tmp"
- "--default-ondelete-policy=delete"
- "--socket-permissions=0777"
{{- end }}

{{- define "csi_controller_envs" }}
- name: NODE_ID
  valueFrom:
    fieldRef:
      fieldPath: spec.nodeName
- name: CSI_ENDPOINT
  value: unix:///csi/csi.sock
{{- include "helm_lib_envs_for_proxy" . }}
{{- end }}

{{- define "csi_additional_controller_volume" }}
- name: pods-mount-dir
  hostPath:
    path: /var/lib/kubelet/pods
    type: Directory
- name: tmp-dir
  emptyDir: {}
- name: root-squash-probe-tmp
  emptyDir: {}

{{- include "csi_init_containers_volume" . }}
{{- end }}

{{- define "csi_additional_controller_volume_mounts" }}
- name: pods-mount-dir
  mountPath: /var/lib/kubelet/pods
  mountPropagation: "Bidirectional"
- mountPath: /tmp
  name: tmp-dir

{{- include "nfsv3_container_volume_mounts" . }}
{{- end }}

{{- /*
  The root-squash probe publishes the RootSquash condition of NFSStorageClasses
  (images/root-squash-probe). It has to mount the export as root, which neither the
  unprivileged module controller nor the webhook can, so it runs here: privileged, in
  the host network where the RPC-with-TLS handshakes reach the tlshd of the CSI node
  Pod, and on the same nodes. Only the leader of the replicas probes.

  Its mount points live in an emptyDir mounted without propagation, so the mounts stay
  in the mount namespace of the container and die with it.

  No liveness or readiness probe: a listener would take a port on the node, and every
  step of a probe is bounded by a timeout, while a lost leader election ends the process.
*/}}
{{- define "csi_controller_additional_containers" }}
- name: root-squash-probe
  image: {{ include "helm_lib_module_image" (list . "rootSquashProbe") }}
  imagePullPolicy: IfNotPresent
  env:
    - name: LOG_LEVEL
      value: {{ include "helm_lib_module_controller_log_level" (list . "csiNfs") | quote }}
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
  securityContext:
    privileged: true
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    requests:
      {{- include "helm_lib_module_ephemeral_storage_only_logs" . | nindent 6 }}
  volumeMounts:
    - name: root-squash-probe-tmp
      mountPath: /tmp
{{- end }}

{{- define "csi_controller_additional_vpa" }}
- containerName: "root-squash-probe"
  minAllowed:
    cpu: 10m
    memory: 25Mi
  maxAllowed:
    cpu: 50m
    memory: 128Mi
{{- end }}

{{- $csiControllerConfig := dict }}
{{- $_ := set $csiControllerConfig "controllerImage" $csiControllerImage }}
{{- $_ := set $csiControllerConfig "snapshotterEnabled" true }}
{{- $_ := set $csiControllerConfig "resizerEnabled" true }}
# We need to run as root to be able to mount NFS volumes during provisioning
{{- $_ := set $csiControllerConfig "runAsRootUser" true }}
{{- $_ := set $csiControllerConfig "capacityEnabled" false }}
{{- $_ := set $csiControllerConfig "provisionerTimeout" "1200s" }}
{{- $_ := set $csiControllerConfig "snapshotterTimeout" "1200s" }}
{{- $_ := set $csiControllerConfig "extraCreateMetadataEnabled" true }}
{{- $_ := set $csiControllerConfig "livenessProbePort" 4229 }}
{{- $_ := set $csiControllerConfig "csiControllerHaMode" true }}
{{- $_ := set $csiControllerConfig "attacherEnabled" false }}
{{- $_ := set $csiControllerConfig "forceCsiControllerPrivilegedContainer" true }}
{{- $_ := set $csiControllerConfig "securityPolicyExceptionEnabled" true }}
{{- $_ := set $csiControllerConfig "additionalControllerArgs" (include "csi_controller_args" . | fromYamlArray) }}
{{- $_ := set $csiControllerConfig "additionalControllerEnvs" (include "csi_controller_envs" . | fromYamlArray) }}
{{- $_ := set $csiControllerConfig "additionalControllerVolumes" (include "csi_additional_controller_volume" . | fromYamlArray) }}
{{- $_ := set $csiControllerConfig "additionalControllerVolumeMounts" (include "csi_additional_controller_volume_mounts" . | fromYamlArray) }}
{{- $_ := set $csiControllerConfig "initContainers" (include "csi_init_containers" . | fromYamlArray) }}
{{- $_ := set $csiControllerConfig "customNodeSelector" (include "csi_custom_node_selector" . | fromYaml) }}
{{- $_ := set $csiControllerConfig "additionalContainers" (include "csi_controller_additional_containers" . | fromYamlArray) }}
{{- $_ := set $csiControllerConfig "additionalControllerVPA" (include "csi_controller_additional_vpa" . | fromYamlArray) }}

{{- include "helm_lib_csi_controller_manifests" (list . $csiControllerConfig) }}


###
### node
###


{{- define "csi_node_args" }}
- "--v={{ include "module_klog_verbosity" . }}"
- "--nodeid=$(NODE_ID)"
- "--endpoint=$(CSI_ENDPOINT)"
{{- with .Values.global.clusterConfiguration }}
- "--deny-inline-cidrs={{ .podSubnetCIDR }},{{ .serviceSubnetCIDR }}"
{{- end }}
- "--drivername=nfs.csi.k8s.io"
- "--mount-permissions=0"
{{- end }}

{{- define "csi_node_envs" }}
- name: NODE_ID
  valueFrom:
    fieldRef:
      fieldPath: spec.nodeName
- name: CSI_ENDPOINT
  value: unix:///csi/csi.sock
{{- end }}

{{- define "csi_node_additional_vpa" }}
{{- if .Values.csiNfs.internal.featureTLSEnabled }}
{{- if .Values.csiNfs.internal.tlsCABundle }}
- containerName: "tlshd"
  minAllowed:
    cpu: 12m
    memory: 25Mi
  maxAllowed:
    cpu: 25m
    memory: 50Mi
{{- end }}
{{- end }}
{{- end }}


{{- define "csi_additional_node_volume" }}
{{- include "csi_init_containers_volume" . }}
{{- include "csi_tlshd_container_volume" . }}
- name: tmp-dir
  emptyDir: {}
{{- end }}

{{- define "csi_additional_node_volume_mounts" }}
{{- include "nfsv3_container_volume_mounts" . }}
- mountPath: /tmp
  name: tmp-dir
{{- end }}

{{- define "csi_additional_node_containers" }}
{{- include "csi_tlshd_container" . }}
{{- end }}

{{- $csiNodeConfig := dict }}
{{- $_ := set $csiNodeConfig "nodeImage" $csiControllerImage }}
{{- $_ := set $csiNodeConfig "driverFQDN" "nfs.csi.k8s.io" }}
{{- $_ := set $csiNodeConfig "livenessProbePort" 4230 }}
{{- $_ := set $csiNodeConfig "serviceAccount" "csi" }}
{{- $_ := set $csiNodeConfig "additionalNodeVPA" (include "csi_node_additional_vpa" . | fromYamlArray) }}
{{- $_ := set $csiNodeConfig "additionalNodeArgs" (include "csi_node_args" . | fromYamlArray) }}
{{- $_ := set $csiNodeConfig "additionalNodeEnvs" (include "csi_node_envs" . | fromYamlArray) }}
{{- $_ := set $csiNodeConfig "additionalNodeVolumes" (include "csi_additional_node_volume" . | fromYamlArray) }}
{{- $_ := set $csiNodeConfig "additionalNodeVolumeMounts" (include "csi_additional_node_volume_mounts" . | fromYamlArray) }}
{{- $_ := set $csiNodeConfig "additionalContainers" (include "csi_additional_node_containers" . | fromYamlArray) }}
{{- $_ := set $csiNodeConfig "initContainers" (include "csi_init_containers" . | fromYamlArray) }}
{{- $_ := set $csiNodeConfig "customNodeSelector" (include "csi_custom_node_selector" . | fromYaml) }}
{{- $_ := set $csiNodeConfig "forceCsiNodeAndStaticNodesDepoloy" true }}
{{- $_ := set $csiNodeConfig "securityPolicyExceptionEnabled" true }}

{{- include "helm_lib_csi_node_manifests" (list . $csiNodeConfig) }}
