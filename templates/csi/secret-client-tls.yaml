{{- /*
nfs-client-tls keeps the client identity the hook issues, the key of its CA with it, so
that the hook finds it on the next run and renews the certificate by the same CA. tlshd-client-key holds the key of the identity
tlshd presents; the certificate and its CA, which are public, are in ConfigMap tlshd-conf.
*/ -}}
{{- with .Values.csiNfs.internal.clientTLS }}
{{- if and .crt .key .ca .caKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: nfs-client-tls
  namespace: d8-{{ $.Chart.Name }}
  {{- include "helm_lib_module_labels" (list $) | nindent 2 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .crt | b64enc }}
  tls.key: {{ .key | b64enc }}
  ca.crt: {{ .ca | b64enc }}
  ca.key: {{ .caKey | b64enc }}
{{- end }}
{{- end }}
{{- if .Values.csiNfs.internal.featureTLSEnabled }}
{{- if .Values.csiNfs.internal.tlsCABundle }}
{{- $key := include "csi_nfs_client_key" . }}
{{- if $key }}
---
apiVersion: v1
kind: Secret
metadata:
  name: tlshd-client-key
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
type: Opaque
data:
  client.key: {{ $key | b64enc }}
{{- end }}
{{- end }}
{{- end }}
