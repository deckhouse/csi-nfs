{{- if eq (include "csi-nfs.rbacv2_new_scheme" .) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    heritage: deckhouse
    module: csi-nfs
    rbac.deckhouse.io/aggregate-to-storage-as: manager
    rbac.deckhouse.io/kind: capability
    rbac.deckhouse.io/capability: "system-capability.csi-nfs.edit"
    rbac.deckhouse.io/scope: system
    rbac.deckhouse.io/namespace: d8-csi-nfs
  name: d8:system-capability:csi-nfs:edit
  annotations:
    en.meta.deckhouse.io/title: "Module csi-nfs: manage cluster resources"
    ru.meta.deckhouse.io/title: "Модуль csi-nfs: управление кластерными ресурсами"
    en.meta.deckhouse.io/description: "Create, update and delete the cluster-scoped resources of the csi-nfs module (NFSStorageClass)."
    ru.meta.deckhouse.io/description: "Создание, изменение и удаление кластерных ресурсов модуля csi-nfs (NFSStorageClass)."
rules:
  - apiGroups:
      - storage.deckhouse.io
    resources:
      - nfsstorageclasses
    verbs:
      - create
      - update
      - patch
      - delete
      - deletecollection
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    heritage: deckhouse
    module: csi-nfs
    rbac.deckhouse.io/aggregate-to-storage-as: manager
    rbac.deckhouse.io/kind: manage
    rbac.deckhouse.io/level: module
    rbac.deckhouse.io/namespace: d8-csi-nfs
  name: d8:manage:permission:module:csi-nfs:edit
rules:
  - apiGroups:
      - storage.deckhouse.io
    resources:
      - nfsstorageclasses
    verbs:
      - create
      - update
      - patch
      - delete
      - deletecollection
{{- end }}
