{{- if eq (include "csi-nfs.rbacv2_new_scheme" .) "true" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: d8:system-capability:csi-nfs:edit
  {{- include "helm_lib_module_labels" (list . (dict "rbac.deckhouse.io/aggregate-to-storage-as" "manager" "rbac.deckhouse.io/capability" "system-capability.csi-nfs.edit" "rbac.deckhouse.io/kind" "capability" "rbac.deckhouse.io/namespace" "d8-csi-nfs" "rbac.deckhouse.io/scope" "system")) | nindent 2 }}
  annotations:
    en.meta.deckhouse.io/description: "Manage the csi-nfs module configuration."
    en.meta.deckhouse.io/title: "Module csi-nfs: edit configuration"
    ru.meta.deckhouse.io/description: "Управление конфигурацией модуля csi-nfs."
    ru.meta.deckhouse.io/title: "Модуль csi-nfs: управление конфигурацией"
rules:
- apiGroups:
  - deckhouse.io
  resources:
  - moduleconfigs
  resourceNames:
  - csi-nfs
  verbs:
  - create
  - delete
  - patch
  - update
- apiGroups:
  - storage.deckhouse.io
  resources:
  - nfsstorageclasses
  verbs:
  - create
  - delete
  - deletecollection
  - patch
  - update
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    heritage: deckhouse
    module: csi-nfs
    rbac.deckhouse.io/aggregate-to-storage-as: manager
    rbac.deckhouse.io/kind: manage
    rbac.deckhouse.io/level: module
    rbac.deckhouse.io/namespace: d8-csi-nfs
  name: d8:manage:permission:module:csi-nfs:edit
rules:
  - apiGroups:
      - storage.deckhouse.io
    resources:
      - nfsstorageclasses
    verbs:
      - create
      - update
      - patch
      - delete
      - deletecollection
{{- end }}
