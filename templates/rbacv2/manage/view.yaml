{{- if eq (include "csi-nfs.rbacv2_new_scheme" .) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    heritage: deckhouse
    module: csi-nfs
    rbac.deckhouse.io/aggregate-to-storage-as: viewer
    rbac.deckhouse.io/kind: capability
    rbac.deckhouse.io/capability: "system-capability.csi-nfs.view"
    rbac.deckhouse.io/scope: system
    rbac.deckhouse.io/namespace: d8-csi-nfs
  name: d8:system-capability:csi-nfs:view
  annotations:
    en.meta.deckhouse.io/title: "Module csi-nfs: view cluster resources"
    ru.meta.deckhouse.io/title: "Модуль csi-nfs: просмотр кластерных ресурсов"
    en.meta.deckhouse.io/description: "Read-only access to the cluster-scoped resources of the csi-nfs module (NFSStorageClass)."
    ru.meta.deckhouse.io/description: "Доступ только на чтение к кластерным ресурсам модуля csi-nfs (NFSStorageClass)."
rules:
  - apiGroups:
      - storage.deckhouse.io
    resources:
      - nfsstorageclasses
    verbs:
      - get
      - list
      - watch
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    heritage: deckhouse
    module: csi-nfs
    rbac.deckhouse.io/aggregate-to-storage-as: viewer
    rbac.deckhouse.io/kind: manage
    rbac.deckhouse.io/level: module
    rbac.deckhouse.io/namespace: d8-csi-nfs
  name: d8:manage:permission:module:csi-nfs:view
rules:
  - apiGroups:
      - storage.deckhouse.io
    resources:
      - nfsstorageclasses
    verbs:
      - get
      - list
      - watch
{{- end }}
