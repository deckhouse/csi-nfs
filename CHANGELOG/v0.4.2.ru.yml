Изменения:
  - Исправлен запуск tlshd: обёртка использует пути установки пакета ktls-utils, поэтому контейнеры net-handshake-checker в csi-controller и csi-node больше не падают с ошибкой «no such file or directory»
  - Исправлены монтирования NFSv3: в образ добавлен файл /etc/netconfig, без которого вызовы SUN RPC из userspace не проходили дальше portmapper (NFSv4 не затронут)
  - Исправлена идемпотентность CreateVolume/CreateSnapshot: повторный вызов больше не перезаписывает данные уже созданного тома — ранее это приводило к невозможности загрузки ВМ с только что клонированных дисков
  - Обновление базовых образов, Go 1.26.5 и lib-helm до 1.72.10
  - Актуализирована документация: README, примеры, FAQ и описания CR
  - Внутренние изменения в сборке модуля и CI, добавлен набор e2e-тестов
