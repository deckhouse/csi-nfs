date: "2026-11-24"

summary: "Под `controller` снова запускается в кластерах с `ContainerdV2` и снапшоттером `erofs`, под с томом csi-nfs больше не зависает в удалении после перезапуска узла, а лейблы Rancher Fleet больше не копируются в StorageClass."

highlights:
  - "Под `controller` больше не падает с ошибкой `read-only file system` и не остаётся в `CrashLoopBackOff` в кластерах с `ContainerdV2` и снапшоттером `erofs` (DKP CSE или DKP с `defaultCRI: ContainerdV2`)."
  - "Под, удалённый, пока ещё идёт первое после перезапуска узла монтирование его тома csi-nfs, больше не зависает в удалении до принудительного удаления."

improvements:
  - "external-resizer CSI-контроллера больше не держит информер (кеш с подпиской на изменения) по всем подам кластера: драйвер при расширении тома никогда не сообщает, что том используется, поэтому этот информер не нужен. Это снижает память, которую CSI-контроллер занимает на master-узлах; его поды один раз пересоздаются при обновлении."

fixes:
  - "Под `controller` теперь запускается в кластерах с `ContainerdV2` и снапшоттером `erofs` (DKP CSE или DKP с `defaultCRI: ContainerdV2`): в его образе есть точка монтирования `/etc/webhook/certs`, поэтому контейнер больше не падает с ошибкой `read-only file system` и не остаётся в `CrashLoopBackOff`."
  - "Под с томом csi-nfs больше не зависает в удалении навсегда после перезапуска узла. Если под удаляли, пока шло первое после перезапуска монтирование его тома, например вытеснением по taint с узла, который был недоступен, а монтирование длилось дольше 110 секунд — таймаута node-плагина, — плагин сообщал о неудаче, которую kubelet считает окончательной. kubelet удалял файл `vol_data.json` тома, больше не мог его размонтировать и каждые 100 мс писал в журнал `unmounter failed to load volume data file`, а под и реплика его StatefulSet оставались в таком состоянии до принудительного удаления. Теперь плагин сообщает о таком таймауте как о незавершённой операции: kubelet сохраняет данные тома, повторяет монтирование для пода, которому том ещё нужен, и размонтирует том удалённого пода."
  - "Лейблы с префиксом `fleet.cattle.io/` больше не копируются из ресурсов StorageClass модуля в StorageClass. В значении по умолчанию `storageClassLabelIgnoredPrefixes` был указан префикс с опечаткой, `fleet.cattle.op/`, поэтому лейблы Rancher Fleet копировались."

security:
  - "Модули OpenTelemetry `go.opentelemetry.io/otel`, `metric` и `trace` в CSI-драйвере (`csi-nfs`) подняты с v1.45.0 до v1.47.0, что закрывает CVE-2026-128085."
