date: "2026-11-14"

summary: "В DKP 1.78 и новее роли просмотра и редактирования модуля охватывают и его ModuleConfig, модуль можно собрать в изолированной сети, а образы пересобраны на базовых образах v4.0.12 с Go 1.27.4."

highlights:
  - "В DKP 1.78 и новее роли `d8:system-capability:csi-nfs:view` и `d8:system-capability:csi-nfs:edit` дают также доступ на чтение и запись к ModuleConfig `csi-nfs`."
  - "Сборка модуля больше не обращается к базе контрольных сумм Go (`sum.golang.org`) и использует кэш Go-модулей сборочного хоста, поэтому модуль собирается в изолированной сети из подготовленных кэшей."

improvements:
  - "В DKP 1.78 и новее роли `d8:system-capability:csi-nfs:view` и `d8:system-capability:csi-nfs:edit` дают также доступ на чтение к ModuleConfig `csi-nfs`, а `edit` — и на запись, и несут стандартные заголовки и описания платформы, как все capability ролевой модели DKP 1.78. RBAC модуля теперь описан в `rbac.yaml`, и шаблоны RBACv2 пишутся из него; кластеры ниже DKP 1.78 сохраняют прежние роли."
  - "Страницы release notes в документации рендерятся инструментом, закреплённым вместе с контрольными суммами в `.werf/tools/go.mod`, а кэш Go-модулей сборочного хоста (`~/go-pkg-cache`) сохраняется между сборками. В образах и в кластере ничего не меняется."

dependencies:
  - name: base images
    from: "v4.0.7"
    to: "v4.0.12"
    notes: "Все образы модуля пересобраны на актуальных базовых образах."
  - name: Go
    from: "1.27.3"
    to: "1.27.4"
    notes: "Версия Go, которой собраны Go-компоненты модуля."
