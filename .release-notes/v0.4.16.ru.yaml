date: "2026-11-20"

summary: "В NFSStorageClass появился шаблон каталога тома на NFS-сервере `spec.connection.subDir`, а модуль потребляет меньше памяти на master-узлах."

highlights:
  - "Новый параметр `spec.connection.subDir` ресурса NFSStorageClass задаёт каталог каждого тома на NFS-сервере по пространству имён и имени его PVC и имени его PV."
  - "Контроллер модуля, CSI-контроллер и `csi-nfs-scheduler-extender` потребляют меньше памяти на master-узлах: в подах меньше контейнеров, а кэши уже."

new_features:
  - "В NFSStorageClass появился параметр `spec.connection.subDir` — шаблон каталога тома на NFS-сервере с подстановками `${pvc.metadata.namespace}`, `${pvc.metadata.name}` и `${pv.metadata.name}`, например для синхронизации томов между площадками. У каждой PVC свой каталог, шаблон без `${pv.metadata.name}` требует `reclaimPolicy: Retain`, после создания класса параметр не меняется. Без параметра каталог остаётся `<share>/<имя PV>`."

improvements:
  - "Модуль потребляет меньше памяти на master-узлах. Контроллер сам обслуживает admission-вебхуки (webhooks — проверки запросов к API) вместо отдельного контейнера `webhooks`; контроллер и `csi-nfs-scheduler-extender` отдают метрики по HTTPS и сами проверяют каждый запрос метрик теми же TokenReview и SubjectAccessReview вместо контейнера kube-rbac-proxy; CSI-контроллер работает без external-attacher, у которого никогда не было работы, так как у CSIDriver `nfs.csi.k8s.io` задано `attachRequired: false`; контроллер и планировщик-расширение (scheduler extender) хранят только метаданные узлов, контроллер кэширует только ModuleConfig `csi-nfs`, планировщик-расширение больше не кэширует PersistentVolume, а контроллер, планировщик-расширение и проба root-squash больше не хранят `managedFields` кэшируемых объектов. Service вебхуков, порты метрик, ServiceMonitor, PodMonitor и правила доступа не меняются; поды контроллера, CSI-контроллера и, если он включён, планировщика-расширения при обновлении пересоздаются один раз."
  - "В режиме HA CSI-контроллер и контроллер модуля работают в двух репликах вместо одной на каждый master-узел и в одной реплике в кластере с одним master-узлом."

fixes:
  - "Цикл контроллера, который ставит и снимает метку `storage.deckhouse.io/csi-nfs-node` на узлах и удаляет поды модуля, оставшиеся на узлах без неё, теперь выполняется только на реплике, владеющей lease лидера. Раньше его каждые 10 секунд выполняла каждая реплика, из-за чего запросы к API дублировались, а реплики конкурировали за одни и те же узлы и поды."
  - "У `csi-nfs-scheduler-extender` появились liveness- и readiness-пробы: зависший планировщик-расширение перезапускается, а запускающаяся реплика получает запросы от kube-scheduler только после готовности."
  - "Валидаторы NFSStorageClass и ModuleConfig теперь отвечают на admission-запрос ошибкой, если не могут прочитать ModuleConfig `csi-nfs` или получить список NFSStorageClass, а не завершают процесс. Раньше такая временная ошибка API перезапускала контейнер `webhooks`; теперь API-сервер применяет к этому запросу `failurePolicy` вебхука, и запрос можно повторить."
  - "На узлах без собственных `rpcbind` и `nfs-utils`, где модуль поднимает свой userspace NFSv3, `rpc.statd` больше не падает при старте в Rocky Linux, RHEL, AlmaLinux и других системах, где в `/etc/nsswitch.conf` раньше `files` указан `sss` или другой загружаемый NSS-модуль. Раньше `d8-csi-nfs-rpc-statd.service` перезапускался каждые несколько секунд, и любое монтирование NFSv3 на таком узле завершалось ошибкой `rpc.statd is not running but is required for remote locking`."

docs:
  - "В документации перечислены операционные системы и ядра, проверенные для RPC-with-TLS, и команда проверки узла, описано требование к ядру (`CONFIG_NET_HANDSHAKE`, обычно ядра 6.5 и новее), порядок удаления PV, оставшихся после удаления NFSStorageClass с RPC-with-TLS, а руководство по установке NFS-сервера на РЕД ОС 8 добавлено в английскую локаль."
  - "Документация называет модуль `storage-foundation`, а не `snapshot-controller`, модулем, который требуется для снимков томов, и больше не предлагает включать `snapshot-controller`."
