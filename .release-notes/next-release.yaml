fixes:
  - "The logs of the `controller` container and of the `root-squash-probe` container of the CSI controller Pod no longer show `[controller-runtime] log.SetLogger(...) was never called; logs will not be displayed` with a stack trace. The messages of the controller-runtime cache and of the Kubernetes client inside them, such as `Failed to watch` when a resource cannot be listed, were dropped; they are now written to the log of the container in the same format as its other messages."
  - "The `webhooks` container no longer drops the internal messages of controller-runtime and of the Kubernetes client, such as API warnings, and writes them to its log in the same format as its other messages."
