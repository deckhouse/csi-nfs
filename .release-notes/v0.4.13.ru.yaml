date: "2026-11-05"

summary: "NFSStorageClass может нести собственный CA для RPC-with-TLS и сообщает, подменяет ли NFS-сервер root, CSI-плагин узла больше не копит зависшие монтирования, встроенные (inline) тома больше не могут обращаться к NFS-серверам внутри кластера, а в образах модуля больше нет найденных уязвимостей `golang.org/x/net`."

highlights:
  - "CSI-плагин узла больше не запускает новый `mount` тома, пока предыдущий ещё висит: повторная попытка возвращает `Aborted` с возрастом идущего монтирования, а не добавляет ещё один процесс каждые две минуты."
  - "Поле `spec.tlsParameters.ca` в NFSStorageClass задаёт CA, которым проверяется NFS-сервер класса, поэтому классам с RPC-with-TLS больше не нужен CA в ModuleConfig, а новый CA доходит до узлов без перезапуска подов."
  - "Встроенный (inline) CSI-том `nfs.csi.k8s.io`, сервер которого находится в сети подов или сервисов кластера, отклоняется с `PermissionDenied`, поэтому под больше не может по адресу смонтировать экспорты NFS-сервера внутри кластера, например тома других пространств имён."

new_features:
  - "В NFSStorageClass появилось поле `spec.tlsParameters.ca`: корневой сертификат в формате PEM, закодированный в Base64, которым проверяется NFS-сервер класса. Поле допустимо только вместе с `connection.tls: true` и меняется на месте. Классу с TLS теперь нужен CA либо в самом классе, либо в `tlsParameters.ca` модуля. Узлы доверяют CA модуля и CA всех классов вместе, потому что хранилище доверенных сертификатов (truststore) на узле одно для всех монтирований. Для mTLS клиентский сертификат по-прежнему берётся из ModuleConfig. Доступно в редакциях SE, SE+, EE и FE."
  - "NFSStorageClass теперь создаёт событие Kubernetes (Event), когда у условия `Ready` меняется статус или причина: `Warning` с причиной `ReconcileFailed` — когда оно становится `False`, `Normal` с причиной `Reconciled` — когда снова становится `True`, поэтому в `kubectl describe` видно, когда класс сломался и когда восстановился. Если проход согласования ничего не изменил, событие не создаётся. NFSStorageClass — кластерный ресурс, поэтому его события лежат в пространстве имён `default`, и контроллеру выдано право создавать их там."
  - "NFSStorageClass сообщает в условии `RootSquash`, подменяет ли NFS-сервер root другим пользователем на экспорте (`root_squash` или `all_squash`): из-за этого не создаются, не удаляются и не очищаются тома и не меняется владелец файлов для `fsGroup`. CSI-контроллер проверяет экспорт при создании NFSStorageClass и затем каждые 10 минут, а при подмене root записывает событие типа `Warning`. Проверка только предупреждает: NFSStorageClass всё равно создаётся, а `Ready` от неё не зависит. Симптомы и расшифровка условия — в FAQ."

improvements:
  - "NFSStorageClass больше нельзя создать с именем StorageClass другого провижинера. Модуль называет свой StorageClass по имени NFSStorageClass, поэтому такой ресурс раньше создавался и оставался в состоянии `Failed`; теперь вебхук отклоняет его при создании и называет StorageClass, который занимает имя."
  - "Изменение CA в ModuleConfig или в NFSStorageClass доходит до хранилища доверенных сертификатов `tlshd` на узлах без перезапуска подов CSI: хранилище монтируется каталогом, который kubelet обновляет, а `tlshd` читает его при каждом рукопожатии TLS."
  - "Валидирующие вебхуки и обёртка `tlshd` пишут сообщения через логгер модуля: они следуют `logLevel` модуля и выводятся в JSON, как в остальных контейнерах модуля, а не текстом с фиксированным уровнем."

fixes:
  - "CSI-плагин узла больше не копит зависшие монтирования. `NodePublishVolume` переставал ждать `mount` через 110 секунд, а процесс продолжал работать, и при монтировании `hard`, застрявшем в ядре, каждая повторная попытка kubelet запускала ещё один; на тестовом узле за два дня их накопилось 1660. Теперь монтирование, пережившее свой тайм-аут, запоминается до завершения его процесса, и повторная попытка для того же тома и того же целевого пути возвращает `Aborted` с возрастом этого монтирования, а не запускает новое. Под по-прежнему можно удалить, пока монтирование висит. Запись хранится в памяти: после перезапуска контейнера csi-node повторная попытка запускает одно новое монтирование."
  - "Метка `storage.deckhouse.io/managed-by` на StorageClass, которые создаёт модуль, теперь содержит имя модуля — `csi-nfs` — вместо `nfs-storage-class-controller`. Существующие StorageClass получают новое значение при первом согласовании после обновления, без пересоздания. Селекторы меток и запросы мониторинга по старому значению нужно обновить. На Secret и VolumeSnapshotClass модуля метка сохраняет прежнее значение."
  - "Контроллер больше не удаляет финализаторы, которые другие компоненты поставили на StorageClass модуля, когда обновляет StorageClass на месте, например после изменения его меток или параметров монтирования. Раньше обновление заменяло объект целиком тем, который строит контроллер, а в нём есть только собственный финализатор контроллера."

security:
  - "Встроенный (inline) CSI-том `nfs.csi.k8s.io` (том `csi` в спецификации пода) больше не может смонтировать NFS-сервер внутри кластера. Плагин узла монтирует с узла, поэтому сервер в кластере, который пускает узлы, как серверы sds-nfs, отдавал любому поду, знающему его адрес, всё, что экспортирует, включая тома других пространств имён. Если сервер встроенного тома разрешается в адрес из сети подов или сервисов кластера либо не разрешается вовсе, под не запускается с ошибкой `PermissionDenied`. Для этого у CSIDriver `nfs.csi.k8s.io` теперь `podInfoOnMount: true`. PersistentVolume и встроенные тома серверов вне кластера это не затрагивает."
  - "`golang.org/x/net` обновлён с v0.60.0 до v0.62.0 в CSI-драйвере (`csi-nfs`) и в контроллере, планировщике-расширении (scheduler extender), вебхуках и хуках модуля, что закрывает CVE-2026-78661 и CVE-2026-97045."

breaking:
  - "Встроенные (inline) CSI-тома `nfs.csi.k8s.io`, указывающие на NFS-сервер внутри кластера (его адрес в сети подов или сервисов либо имя не разрешается на узле), больше не монтируются, и их поды не запускаются с ошибкой `PermissionDenied`."

upgrade_notes:
  - "Если поды используют встроенные (inline) CSI-тома `nfs.csi.k8s.io` с NFS-сервером внутри кластера, перед обновлением переведите их на PersistentVolume из NFSStorageClass."
  - "В поде CSI-контроллера появляется контейнер `root-squash-probe`. Каждые 10 минут он монтирует экспорт каждого NFSStorageClass и ненадолго создаёт в корне экспорта скрытый файл `.csi-nfs-root-squash-probe-<hash>`. После обновления проверьте условие `RootSquash` у классов."
  - "Селекторы меток, запросы мониторинга и автоматизацию, которые ищут StorageClass по `storage.deckhouse.io/managed-by: nfs-storage-class-controller`, нужно перевести на `csi-nfs`. Существующие StorageClass получают новую метку на месте."

docs:
  - "В FAQ описано, что ломается, когда NFS-сервер подменяет root, как модуль проверяет экспорт и как читать условие `RootSquash`. В примерах показан NFSStorageClass с собственным CA в `spec.tlsParameters.ca`, а в ограничениях описан отказ встроенным томам NFS-серверов внутри кластера."
