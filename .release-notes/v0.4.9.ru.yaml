date: "2026-09-14"

summary: "Prometheus снова собирает метрики контроллера, а узел, репозитории которого не дают NFSv3-userspace, получает его из модуля — раньше на таком узле любое монтирование NFSv3 висело вечно."

highlights:
  - "Там, где пакетный менеджер узла не может установить `rpcbind` и `nfs-common`/`nfs-utils`, модуль ставит оба демона из собственного образа `nfs-tools`. Без них под CSI-узла на таком узле вообще не стартует, а любое монтирование NFSv3 висит вечно."
  - "`kube-rbac-proxy` перед метриками контроллера снова имеет право проверять запросы сбора: с тех пор как метрики ушли за него, каждый сбор отклонялся и таргет контроллера в Prometheus оставался недоступным."

new_features:
  - "На узле, репозитории которого не могут предоставить `rpcbind` и `nfs-common`/`nfs-utils`, `NodeGroupConfiguration` откатывается на собственный пакетный образ модуля `nfs-tools`: содержимое распаковывается в `/var/lib/deckhouse/sds/csi-nfs`, демоны поднимаются юнитами `d8-csi-nfs-rpcbind.service` и `d8-csi-nfs-rpc-statd.service`. Пакеты дистрибутива остаются предпочтительным путём, узел со своим `rpcbind` остаётся нетронутым. Это касается только NFSv3, то есть кластеров с `v3support: true`; NFSv4 ни одного из этих демонов не требует. Кроме того, шаг установки теперь роняет шаг bashible, если сокет портмаппера не отвечает, — вместо сообщения об успехе и узла с зависающими монтированиями."

fixes:
  - "Prometheus не мог собирать метрики контроллера модуля: `kube-rbac-proxy` перед ними не имел права создавать `TokenReview` и `SubjectAccessReview`, которыми авторизуется каждый сбор, поэтому все сборы отклонялись и таргет оставался недоступным. Затронуты кластеры на v0.4.8, где метрики были переведены за прокси."
  - "`rpc.statd` из собственного пакета модуля находит `sm-notify` и больше не стартует с пустым файлом состояния, поэтому перезагрузившийся узел оповещает о перезагрузке узлы, удерживающие на нём блокировки NFSv3."

improvements:
  - "Значение `logLevel` по умолчанию теперь `INFO`, а не `DEBUG` — его получит кластер, в котором параметр не задан явно."

upgrade_notes:
  - "Руками делать ничего не нужно. Таргет контроллера в Prometheus восстановится сам после выката обновлённого контроллера, а откат на пакет модуля затрагивает только узлы, где пакеты дистрибутива установить не удаётся."
  - "Кластеру, который полагался на прежнюю подробность логов, следует явно задать `logLevel: DEBUG` в конфигурации модуля, поскольку значение по умолчанию теперь `INFO`."
