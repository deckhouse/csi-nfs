date: "2026-09-24"

summary: "Обновление безопасности: CSI-драйвер и хуки модуля пересобраны с исправленными `grpc` и `x/crypto`."

highlights:
  - "`google.golang.org/grpc` обновлён с v1.82.1 до v1.83.2 в CSI-драйвере (`csi-nfs`), что закрывает CVE-2026-84303, CVE-2026-84304 и CVE-2026-84445."

security:
  - "`google.golang.org/grpc` обновлён с v1.82.1 до v1.83.2 в CSI-драйвере (`csi-nfs`), что закрывает CVE-2026-84303, CVE-2026-84304 и CVE-2026-84445."
  - "`golang.org/x/crypto` обновлён с v0.53.0 до v0.57.0 в CSI-драйвере (`csi-nfs`) и хуках модуля (`go-hooks`), что закрывает CVE-2026-56854 (обход аутентификации по адресу источника в `x/crypto/ssh`), CVE-2026-56855 и CVE-2026-78662."
