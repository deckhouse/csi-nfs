date: "2026-10-26"

summary: "Вебхук модуля для StorageClass больше не мешает StorageClass других провизионеров, CSI-драйвер пишет логи на уровне из `logLevel`, поды CSI готовы к обязательному применению Pod Security в DKP 1.79, а в образах модуля обновлены зависимости с известными уязвимостями."

highlights:
  - "Валидирующий вебхук модуля для StorageClass теперь получает только классы с провизионером `nfs.csi.k8s.io`. Пока у вебхука не было готовой конечной точки, отклонялась любая запись StorageClass в кластере, и это могло задерживать другие модули, создающие StorageClass."
  - "Контейнеры `nfsplugin` CSI-контроллера и CSI-узла следуют `logLevel` модуля, а не всегда работают с детализацией klog 5, поэтому установка по умолчанию больше не засыпает лог отладочным выводом."
  - "Поды CSI-контроллера и CSI-узла получают по `SecurityPolicyException`, поэтому они по-прежнему допускаются в DKP 1.79 и новее, где привилегированные поды в системных пространствах имён отклоняются, а не только вызывают предупреждение."

improvements:
  - "Поды CSI-контроллера и CSI-узла получают по `SecurityPolicyException`, где описано, что им нужно сверх профиля restricted стандарта Pod Security Standards: контейнеры от root и привилегированные контейнеры, `SYS_ADMIN` у контроллера, сеть узла и тома hostPath для kubelet, `/dev`, `/run`, `/sys` и `/lib/modules`. В DKP 1.79 и новее такие поды в системных пространствах имён без исключения отклоняются. Исключения создаются, только пока включён модуль `admission-policy-engine-crd`. Контейнеры, которые модуль добавляет в эти поды (`wait-rpcbind`, `ktls-enabler`, `net-handshake-checker`, `tlshd`), теперь сбрасывают все capabilities (привилегии ядра Linux), а `wait-rpcbind` больше не разрешает повышение привилегий."

fixes:
  - "У валидирующего вебхука для StorageClass появилось условие соответствия (match condition) на провизионер `nfs.csi.k8s.io` у нового или старого объекта — ровно те классы, которые он проверяет. Раньше он получал каждый StorageClass в кластере с `failurePolicy: Fail`, поэтому, пока поды вебхука модуля не были готовы (например, не могли скачать образы), StorageClass других модулей нельзя было создать, изменить или удалить, и Deckhouse мог застрять на модуле, который применяет свои StorageClass, так и не дав csi-nfs восстановиться."
  - "Контейнеры `nfsplugin` CSI-контроллера и CSI-узла берут детализацию klog из `logLevel` модуля: `ERROR` даёт 0, `WARN` — 1, `INFO` (по умолчанию) — 2, `DEBUG` — 4, `TRACE` — 5. Раньше они работали с `--v=5` независимо от `logLevel`; чтобы вернуть прежний объём вывода, задайте `logLevel: TRACE`."

security:
  - "CSI-драйвер (`csi-nfs`), контроллер, планировщик-расширение (scheduler extender), вебхуки и хуки модуля собираются с обновлёнными Go-зависимостями, что закрывает CVE-2026-78669, CVE-2026-78659, CVE-2026-78660, CVE-2026-78663, CVE-2026-97032 и CVE-2026-56851, а в драйвере ещё и CVE-2026-61801; в хуках также закрыта CVE-2026-63209, и из них убран `github.com/docker/distribution`, в котором была CVE-2026-85747 без исправленного выпуска."
