date: "2026-11-24"

summary: "The `controller` Pod starts again on clusters with `ContainerdV2` and the `erofs` snapshotter, a Pod with a csi-nfs volume no longer stays terminating after its node restarts, and Rancher Fleet labels are no longer copied to StorageClasses."

highlights:
  - "The `controller` Pod no longer fails with `read-only file system` and no longer stays in `CrashLoopBackOff` on clusters with `ContainerdV2` and the `erofs` snapshotter (DKP CSE, or DKP with `defaultCRI: ContainerdV2`)."
  - "A Pod deleted while the first mount of its csi-nfs volume after a node restart is still running no longer stays terminating until a forced delete."

improvements:
  - "The external-resizer of the CSI controller no longer keeps an informer over every Pod of the cluster: the driver never reports a volume in use on expansion, so the resizer does not need it. This lowers the memory the CSI controller takes on master nodes; its Pods are recreated once during the update."

fixes:
  - "The `controller` Pod now starts on clusters with `ContainerdV2` and the `erofs` snapshotter (DKP CSE, or DKP with `defaultCRI: ContainerdV2`): its image contains the `/etc/webhook/certs` mount point, so the container no longer fails with `read-only file system` and no longer stays in `CrashLoopBackOff`."
  - "A Pod with a csi-nfs volume no longer stays terminating for good after its node restarts. When the Pod was deleted while the first mount of its volume after the restart was still running, for example by the taint eviction of a node that had been down, and the mount took longer than the 110-second timeout of the node plugin, the plugin reported a failure that kubelet takes as final. kubelet then removed the `vol_data.json` file of the volume, could no longer unmount it and logged `unmounter failed to load volume data file` every 100 ms, and the Pod and its StatefulSet replica were stuck until a forced delete. The plugin now reports such a timeout as an operation still in progress: kubelet keeps the volume data, retries the mount for a Pod that still needs the volume, and unmounts the volume of a deleted Pod."
  - "Labels with the `fleet.cattle.io/` prefix are no longer copied from the StorageClass resources of the module to the StorageClasses. The default of `storageClassLabelIgnoredPrefixes` listed a misspelled prefix, `fleet.cattle.op/`, so the Rancher Fleet labels were copied."

security:
  - "The OpenTelemetry modules `go.opentelemetry.io/otel`, `metric` and `trace` are raised from v1.45.0 to v1.47.0 in the CSI driver (`csi-nfs`), closing CVE-2026-128085."
